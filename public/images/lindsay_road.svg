<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <!-- Sky -->
  <rect width="600" height="350" fill="#1E293B"/>
  <path d="M0,0 L600,0 L600,200 L0,200 Z" fill="#0F172A"/>
  
  <!-- School Building Silhouette with Dublin Architecture -->
  <rect x="60" y="100" width="480" height="180" fill="#334155" rx="4"/>
  <!-- Pitched Roof -->
  <polygon points="40,100 300,30 560,100" fill="#475569"/>
  <!-- Bell Tower / Clock Tower -->
  <rect x="270" y="10" width="60" height="50" fill="#1E293B"/>
  <polygon points="260,10 300,-15 340,10" fill="#F59E0B"/>
  <circle cx="300" cy="35" r="12" fill="#FDE047"/>
  
  <!-- Windows -->
  <g fill="#FEF08A" opacity="0.85">
    <rect x="100" y="130" width="40" height="60" rx="3"/>
    <rect x="160" y="130" width="40" height="60" rx="3"/>
    <rect x="220" y="130" width="40" height="60" rx="3"/>
    <rect x="340" y="130" width="40" height="60" rx="3"/>
    <rect x="400" y="130" width="40" height="60" rx="3"/>
    <rect x="460" y="130" width="40" height="60" rx="3"/>
  </g>

  <!-- Ground / Pavement -->
  <rect x="0" y="280" width="600" height="70" fill="#0B0F19"/>
  
  <!-- Banner Plaque -->
  <rect x="150" y="235" width="300" height="45" rx="6" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
  <text x="300" y="255" font-family="serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">LINDSAY ROAD NATIONAL SCHOOL</text>
  <text x="300" y="271" font-family="sans-serif" font-size="12" fill="#FDE047" text-anchor="middle">Glasnevin, Dublin 9 • Cabra Judo Training Center</text>
</svg>